name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Hermetic CI: the corpus ref is pinned, never floating. Bump this
  # one line deliberately with each corpus release (the tag carries
  # what changed).
  CORPUS_REF: v0.8.0
  # The identity oracle corpus (chemomer/inchi-tests) — the same pin
  # chemomer's own CI gates the engine at; the identity family must
  # never drift from the engine it consumes.
  CHEMOMER_CORPUS_REF: v0.3.41
  # The XML engine behind the CML round-trip (the leptris family
  # directive: parse and serialize the CML wire through libleptris,
  # never quick-xml, never hand-rolled strings). Pinned tag; the
  # `leptris` crate links it via LEPTRIS_LIB_PATH at build time.
  LEPTRIS_REF: v1.9.399

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Clone conformance corpus (asciichem-tests)
        uses: actions/checkout@v7
        with:
          repository: asciichem/asciichem-tests
          ref: ${{ env.CORPUS_REF }}
          path: .asciichem-tests
      - name: Point the suite at the corpus
        run: echo "ASCIICHEM_CORPUS=$(pwd)/.asciichem-tests/corpus/fixtures" >> "$GITHUB_ENV"
      - name: Clone identity oracle corpus (chemomer/inchi-tests)
        uses: actions/checkout@v7
        with:
          repository: chemomer/inchi-tests
          ref: ${{ env.CHEMOMER_CORPUS_REF }}
          path: .inchi-tests
      # Bootstrap libleptris: the same CMake shared-library build
      # leptris-rs's own CI runs (utf8proc on, CLI/benchmarks/tests
      # off). The built .so feeds LEPTRIS_LIB_PATH for the compile and
      # LD_LIBRARY_PATH for the test binaries (a dependency's -rpath
      # link-arg does not reach this crate's binaries).
      - name: Install utf8proc (libleptris dependency)
        run: |
          sudo apt-get update
          sudo apt-get install -y libutf8proc-dev
      - name: Checkout and build libleptris (pinned)
        run: |
          git clone --depth 1 --branch "$LEPTRIS_REF" \
            https://github.com/leptris/leptris .leptris-engine
          cmake -B .leptris-engine/build-shared -S .leptris-engine \
            -DCMAKE_BUILD_TYPE=Release \
            -DLEPTRIS_BUILD_SHARED=ON -DLEPTRIS_BUILD_STATIC=OFF \
            -DBUILD_TESTING=OFF -DLEPTRIS_BUILD_CLI=OFF \
            -DLEPTRIS_BUILD_BENCHMARKS=OFF \
            -DLEPTRIS_ENABLE_UTF8PROC=ON
          cmake --build .leptris-engine/build-shared --config Release -j
          LIB=$(find .leptris-engine/build-shared -type f -o -type l 2>/dev/null \
            | grep -iE '(lib)?leptris\.(dylib|so)$' | head -1)
          if [ -z "$LIB" ]; then
            echo "ERROR: libleptris shared library not found"
            exit 1
          fi
          LIBDIR=$(cd "$(dirname "$LIB")" && pwd)
          echo "LEPTRIS_LIB_PATH=$LIBDIR" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$LIBDIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "Built: $LIB"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The identity oracle gate runs the FULL recorded family
      # (identity*.json, every case byte-exact through the in-process
      # dependency). Release profile only: canonical ranking is
      # debug-bound (~9 min in debug, ~40 s here), and the debug
      # `cargo test` above must not pay that cost.
      - run: cargo test --release --test identity_corpus
        env:
          CHEMOMER_CORPUS: ${{ github.workspace }}/.inchi-tests/corpus/fixtures
